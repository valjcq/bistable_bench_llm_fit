# Experiment: fit K=2 target states of the Wilson-Cowan (1972) model at a task-specific input P.
# Window decision: see NOTES.md ("Wilson-Cowan window"). The budget below is a PLACEHOLDER: the
# Wilson-Cowan budget is not decided and no benchmark run exists.
model: wc1972.yaml  # relative to this file

task:
  K: 2
  tol_fraction: 0.02  # tol = 0.02 * (width 0.5 of the reference range) = 0.01
  noise: 0.0
  seed: 0
  forbid_extra_stable_states: false
  # Asymmetric window for Wilson-Cowan: the HIGH target must lie in [0.1, 0.9] of the reference
  # range [0, 0.5], i.e. E in [0.05, 0.45] (away from saturation); the LOW target is free (the
  # quiescent state E ~ 0 is the background state, the paper's own Fig. 4 low state).
  target_window: [0.1, 0.9]
  lowest_target_free: true
  min_separation_tol_factor: 3.0  # targets must differ by more than 3 * tol
  max_attempts: 5000
  prefilter_starts: 16

checker: {}  # numerical defaults; tol/forbid_extra come from `task`

simulator:
  dt: 0.1
  flow_tol: 1.0e-6
  hold_tau_factor: 5.0
  T: 500.0

scoring:
  naive_ic_fractions: [0.0, 1.0]  # fractions of the model's state bounds [lo, hi]

budget:
  max_evaluations: 200  # PLACEHOLDER: the Wilson-Cowan budget is not decided

baseline:
  optimizer: cma
