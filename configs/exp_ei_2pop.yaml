# Experiment: fit K=2 target states of the E/I network (E observed only).
model: ei_2pop.yaml  # relative to this file

task:
  K: 2
  tol: 0.02                       # abs error per observed population
  noise: 0.0                      # std of noise added to planted targets
  seed: 0
  forbid_extra_stable_states: false
  target_window: [0.05, 0.95]     # fractions of r_max
  min_separation_tol_factor: 3.0  # targets must differ by more than 3 * tol
  max_attempts: 5000
  prefilter_starts: 16

checker: {}  # numerical defaults (see CheckerConfig); tol/forbid_extra come from `task`

simulator:
  dt: 0.1
  flow_tol: 1.0e-6
  hold_tau_factor: 5.0
  T: 500.0

scoring:
  naive_ic_fractions: [0.0, 1.0]  # one per target: low IC <-> lowest target, high IC <-> highest

budget:
  max_evaluations: 1000

baseline:
  optimizer: cma  # optimizer of conditions B and C ("cma" or "tpe")
