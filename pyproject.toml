[project]
name = "bistable-fit-bench"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.15",
    "pyyaml",
    "optuna==5.0.0",
    "cmaes==0.13.1",
]  # scipy 1.15: qmc samplers take `rng=`; optuna and cmaes pinned for reproducibility

[project.optional-dependencies]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "paper: qualitative claims of a paper reproduced by the model (Wilson-Cowan 1972)",
    "computed: regression on values we recomputed from the paper's equations",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["scripts/wc_check.py"]  # committed as given with the model card

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
