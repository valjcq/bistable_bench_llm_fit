name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
