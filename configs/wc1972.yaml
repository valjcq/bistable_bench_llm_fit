# Wilson & Cowan (1972) excitatory-inhibitory model, eqs. 11, 12, 15 of the paper (see
# docs/model_cards/wilson_cowan_1972.md). Free: the card's proposed search box (a difficulty
# knob, wider than the span of the paper's own parameter sets). Fixed: tau_e = tau_i = 10 (the
# card's interpretation; stability of foci depends on the ratio), refractory coefficients 1,
# inputs P = Q = 0. k_e, k_i (maximum of the response) are not set: k = S(+inf) by default; use
# wc1972_k1.yaml for k = 1.
name: wc1972
builder: wc1972
populations: [E, I]
types: [E, I]
observed: [E]  # the paper's hysteresis figures plot E only
free:
  c1: {low: 0.5, high: 25.0, log: false}  # E -> E synapses per excitatory cell
  c2: {low: 0.5, high: 25.0, log: false}  # I -> E (stored positive, applied as -c2)
  c3: {low: 0.5, high: 25.0, log: false}  # E -> I
  c4: {low: 0.5, high: 25.0, log: false}  # I -> I (stored positive, applied as -c4)
  a_e: {low: 0.5, high: 7.0, log: false}  # slope of the excitatory sigmoid
  theta_e: {low: 1.0, high: 6.0, log: false}
  a_i: {low: 0.5, high: 7.0, log: false}
  theta_i: {low: 1.0, high: 6.0, log: false}
fixed:
  P: 0.0
  Q: 0.0
  tau_e: 10.0
  tau_i: 10.0
  rref_e: 1.0
  rref_i: 1.0
