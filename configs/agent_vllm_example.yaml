# EXAMPLE ONLY, fully commented out: nothing in this repository loads it, depends on the server it
# describes, or calls it, and no test does.
#
# What I found by READING /etc/bash.bashrc (nothing was started, stopped or queried):
#   * the shared "llm-qwen36" setup is NOT vLLM. It is a shell alias (Val & Evann's shared aliases)
#     that starts llama.cpp's llama-server in the background:
#         /opt/shared/llama.cpp/build/bin/llama-server
#           --model /opt/shared/models/qwen3.6-35b/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
#           --port 8001 --ctx-size 200000 --n-gpu-layers 999 --host 0.0.0.0 --jinja
#           --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --cache-reuse 256 &
#     (sibling aliases llm-gemma, llm-qwen27 use the same port 8001; llm-stop kills what listens
#     on 8001; llm-check calls /health and /v1/models)
#   * served model name: no --alias is given, so llama-server names the model after the GGUF file
#     (probably "Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"); not verified, because verifying means asking
#     the server. llama-server does not check the "model" field of a request.
#   * host/port: 0.0.0.0:8001, so the OpenAI-compatible base URL is http://localhost:8001/v1
#   * context: --ctx-size 200000 (total; llama-server may divide it between parallel slots,
#     check n_ctx per slot in the server's own log or /props before relying on it)
#   * tool calling: --jinja is set, which enables the model's chat template and with it native
#     OpenAI-style tool calling on /v1/chat/completions. llama.cpp has no --enable-auto-tool-choice
#     and no --tool-call-parser flag (those are vLLM's); the parser follows the chat template.
#   * no --api-key flag is visible, so no key is needed (not verified); environment variable names
#     seen: HF_HOME only (set in /opt/shared/bash_functions.sh). No API-key variable.
#   * the server's own sampling defaults (--temp 0.6, ...) apply to anything a request leaves
#     unset; our backend always sends temperature. The qwen36 alias does not turn thinking off
#     (the qwen27 alias passes enable_thinking=false), so replies may carry reasoning_content.
#
# Example of an `agent:` section for it (uncomment and pass with --agent, only when told to):
#
# agent:
#   backend: openai_compatible
#   base_url: http://localhost:8001/v1
#   model: Qwen3.6-35B-A3B-UD-IQ4_XS.gguf   # label; llama-server ignores it
#   # api_key_env: LLM_API_KEY              # NAME of an environment variable; omit for no key
#   temperature: 0.0
#   max_tokens: 4096
#   max_turns: 60
#   max_tool_calls: 40
#   prompt: system_v1
#   max_retries: 5
#   timeout_s: 600
