# Parameter sets of Wilson & Cowan (1972) read from the figure captions (all confirmed on the page
# images, see docs/model_cards/wilson_cowan_1972.md, "Parameter sets"). Values exactly as in the
# card; rref = 1, tau_e = tau_i = 10 and Q = 0 are in wc1972.yaml. `P` is the input of the figure's
# phase plane; Figs. 5, 6, 7 sweep P.
#
# NOT included: the Fig. 10 set. With the caption values our recomputation makes the rest state a
# saddle, contradicting the paper (card, ambiguity 4), so the set is unusable until clarified.
fig4_5:   # Fig. 4 (P = Q = 0): 3 steady states, 2 stable. Fig. 5: P swept, simple hysteresis
  P: 0.0
  c1: 12
  c2: 4
  c3: 13
  c4: 11
  a_e: 1.2
  theta_e: 2.8
  a_i: 1.0
  theta_i: 4.0
fig6:     # two separate simple hysteresis loops in P
  P: 0.0
  c1: 13
  c2: 4
  c3: 20
  c4: 2
  a_e: 1.2
  theta_e: 2.7
  a_i: 5.0
  theta_i: 3.7
fig7_8:   # Fig. 8 (P = 0): 3 stable, 2 unstable states
  P: 0.0
  c1: 13
  c2: 4
  c3: 22
  c4: 2
  a_e: 1.5
  theta_e: 2.5
  a_i: 6.0
  theta_i: 4.3
fig11:    # Fig. 11 (P = 1.25): limit cycle
  P: 1.25
  c1: 16
  c2: 12
  c3: 15
  c4: 3
  a_e: 1.3
  theta_e: 4.0
  a_i: 2.0
  theta_i: 3.7
